# Compila y prueba dathinel-red (Rust) y Dathinel.Sala (C#) en Windows, Linux y macOS con el entorno fijado de
# build/preparar-entorno.ps1 (las mismas versiones y huellas que en el equipo de Daniel).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            .entorno/cargo/registry
            red/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('red/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Entorno (.NET, Rust, cargo-deny)
        shell: pwsh
        run: ./build/preparar-entorno.ps1

      - name: Rust
        working-directory: red
        run: |
          source ../build/entorno.sh
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked
          cargo test --locked --all-features
          # El binario de las pruebas de C# lleva el relé local de pruebas (--rele-prueba); el de producción se compila sin el feature.
          cargo build --locked --features prueba

      - name: Licencias y avisos de crates
        if: runner.os == 'Linux'
        working-directory: red
        run: |
          source ../build/entorno.sh
          cargo deny --locked check licenses bans sources advisories

      - name: C#
        run: |
          source build/entorno.sh
          dotnet build Sala.slnx -warnaserror
          # Las pruebas de tiempo real y de rendimiento del protocolo dependen del reloj del corredor: no corren en cada PR (como en Rodaje); las de Internet usan el relé público de n0 y solo se lanzan a mano.
          dotnet test Sala.slnx --no-build --filter "Categoria!=TiempoReal&Categoria!=Rendimiento&Categoria!=Internet" --logger "console;verbosity=normal" --blame-hang-timeout 5m

      - name: Native AOT
        run: |
          source build/entorno.sh
          case "$RUNNER_OS" in
            Windows) rid=win-x64; ext=.exe ;;
            Linux) rid=linux-x64; ext= ;;
            macOS) rid=osx-arm64; ext= ;;
          esac
          dotnet publish ejemplos/Consumidor -c Release -r "$rid" -warnaserror
          "ejemplos/Consumidor/bin/Release/net10.0/$rid/publish/Consumidor$ext" "red/target/debug/dathinel-red$ext"
