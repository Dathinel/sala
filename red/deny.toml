# Política de licencias y avisos de dathinel-red: solo permisivas; nada GPL ni no libre.
[graph]
all-features = false

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CDLA-Permissive-2.0", "MPL-2.0", "CC0-1.0", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[advisories]
yanked = "deny"
ignore = [
    # paste: macro de compilación sin mantenimiento (no es un fallo de seguridad); entra por netlink (iroh en Linux).
    { id = "RUSTSEC-2024-0436", reason = "macro de compilación de una dependencia de iroh, sin código en el binario" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
